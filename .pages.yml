# Pages CMS yönetim paneli ayarları (https://app.pagescms.org)
media:
  input: images
  output: images
  categories: [image]

content:
  - name: urunler
    label: Ürünler
    type: file
    path: products.json
    format: json
    fields:
      - name: urunler
        label: Ürünler
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {price} ₺"
        fields:
          - name: name
            label: Ürün adı
            type: string
            required: true
          - name: price
            label: Fiyat (₺)
            type: number
            required: true
          - name: cat
            label: Kategori
            type: select
            required: true
            options:
              values:
                - { value: buket, label: Buketler }
                - { value: gul, label: Güller }
                - { value: vazo, label: "Vazo & Saksı" }
                - { value: ozel, label: Özel Tasarım }
          - name: img
            label: Fotoğraf
            type: image
            required: true
          - name: desc
            label: Açıklama
            type: text
          - name: tag
            label: Etiket
            description: 'Fotoğrafın köşesinde görünür, ör. "En çok tercih edilen". Boş bırakılabilir.'
            type: string
          - name: gunler
            label: Özel günler
            description: Ürün seçilen özel gün sayfalarında gösterilir. Bir güne hiç ürün seçilmezse o sayfada tüm ürünler görünür.
            type: select
            options:
              multiple: true
              values:
                - { value: ogretmenler-gunu, label: Öğretmenler Günü }
                - { value: yilbasi, label: Yılbaşı }
                - { value: sevgililer-gunu, label: Sevgililer Günü }
                - { value: kadinlar-gunu, label: Kadınlar Günü }
                - { value: anneler-gunu, label: Anneler Günü }
                - { value: babalar-gunu, label: Babalar Günü }
                - { value: dogum-gunu, label: Doğum Günü }
                - { value: acilis-tebrik, label: Açılış ve Tebrik }
          - name: active
            label: Sitede göster
            description: Kapatırsanız ürün silinmeden siteden gizlenir.
            type: boolean
            default: true
